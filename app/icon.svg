<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Black circle background -->
  <circle cx="128" cy="128" r="128" fill="#050505"/>
  
  <!-- Equalizer bars -->
  <rect x="36" y="112" width="10" height="40" rx="3" fill="#00FF00"/>
  <rect x="52" y="96" width="10" height="56" rx="3" fill="#00FF00"/>
  <rect x="68" y="72" width="10" height="80" rx="3" fill="#00FF00"/>
  <rect x="84" y="96" width="10" height="56" rx="3" fill="#00FF00"/>

  <!-- The Z & D shapes -->
  <path d="M 60,70 L 170,70 L 110,170 L 200,170" fill="none" stroke="#00FF00" stroke-width="28" stroke-linejoin="round" stroke-linecap="round" />
  
  <path d="M 120,70 Q 230,70 230,120 Q 230,170 120,170" fill="none" stroke="#00FF00" stroke-width="24" stroke-linecap="round" />

  <!-- Play Triangle in D -->
  <polygon points="160,105 160,135 186,120" fill="#00FF00"/>
</svg>
